version: 2

project_name: oraculo

before:
  hooks:
    - go mod tidy

builds:
  - id: oraculo
    main: .
    binary: oraculo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/delfosti-infra/oraculo-cli/cmd.version={{ .Tag }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: oraculo
    formats: [binary]
    name_template: "oraculo_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: delfosti-infra
    name: oraculo-cli
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
